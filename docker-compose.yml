version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: compiler-backend

    ports:
      - "8080:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      DOCKER_HOST: unix:///var/run/docker.sock

    volumes:
      # Required so backend can create/run containers
      - /var/run/docker.sock:/var/run/docker.sock

    networks:
      - compiler-network

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: compiler-frontend

    ports:
      - "4200:80"

    environment:
      NODE_ENV: production

    depends_on:
      - backend

    networks:
      - compiler-network

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

networks:
  compiler-network:
    name: compiler-network
    driver: bridge
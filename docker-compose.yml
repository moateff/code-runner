version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: code-runner-backend

    ports:
      - "8080:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      DOCKER_HOST: unix:///var/run/docker.sock

    volumes:
      # Required so backend can create/run containers
      - /var/run/docker.sock:/var/run/docker.sock

    networks:
      - code-runner-network

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: code-runner-frontend

    ports:
      - "81:80"

    environment:
      NODE_ENV: production

    depends_on:
      - backend

    networks:
      - code-runner-network

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  runner-cpp:
    build:
      context: ./runners/cpp
      dockerfile: Dockerfile

    image: cpp-runner:latest
    
    profiles:
      - build-only

  runner-python:
    build:
      context: ./runners/python
      dockerfile: Dockerfile
    
    image: python-runner:latest

    profiles:
      - build-only

  runner-java:
    build:
      context: ./runners/java
      dockerfile: Dockerfile
    
    image: java-runner:latest

    profiles:
      - build-only

networks:
  code-runner-network:
    name: code-runner-network
    driver: bridge